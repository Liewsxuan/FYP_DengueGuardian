name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            ccache \
            lld \
            aapt

      - name: Set JAVA_HOME and PATH
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      # ----------------------------------------------------------------
      # ROOT CAUSE (confirmed from traceback):
      #
      #   /tmp/build-env-5pg87swv/lib/python3.14/site-packages/Cython/...
      #
      # p4a calls `pip install` inside a throw-away venv at /tmp/build-env-*/
      # That venv is created using the system `venv` module which belongs
      # to Python 3.14 on this runner image (ImageVersion 20260513).
      # pip then installs the LATEST Cython (3.x) into it, which still
      # has `import cgi` in Tempita/_tempita.py.
      # Patching symlinks does nothing because p4a never calls our python3.
      #
      # THE ACTUAL FIX has two parts:
      #
      # 1. Patch pip's build-env mechanism so it cannot create a venv with
      #    Python 3.14. We do this by removing Python 3.14 entirely from
      #    the system so the only available python/python3/python3.x is 3.10.
      #
      # 2. Pre-populate the pip build cache with a patched Cython wheel so
      #    when pip installs Cython into any fresh venv it gets our version,
      #    not one downloaded from PyPI.
      #    We use Cython 3.0.10 which has the `import cgi` bug FIXED
      #    (the fix landed in Cython 3.0.3 — see Cython issue #5751).
      # ----------------------------------------------------------------

      - name: Remove system Python 3.14 so p4a cannot create a 3.14 venv
        run: |
          echo "=== Python versions before ==="
          ls /usr/bin/python* 2>/dev/null || true
          ls /usr/local/bin/python* 2>/dev/null || true

          # Remove deadsnakes / system Python 3.14 if present
          sudo apt remove -y python3.14 python3.14-minimal python3.14-venv \
            python3.14-distutils 2>/dev/null || true
          sudo apt autoremove -y 2>/dev/null || true

          # Also remove the binaries directly in case apt doesn't own them
          sudo rm -f /usr/bin/python3.14 /usr/local/bin/python3.14
          sudo rm -f /usr/lib/python3.14 2>/dev/null || true

          # Point system python3 to our 3.10
          PYTHON310="/opt/hostedtoolcache/Python/3.10.20/x64/bin/python3.10"
          sudo ln -sf "$PYTHON310" /usr/bin/python3
          sudo ln -sf "$PYTHON310" /usr/bin/python
          sudo ln -sf "$PYTHON310" /usr/local/bin/python3
          sudo ln -sf "$PYTHON310" /usr/local/bin/python

          echo "=== Python versions after ==="
          ls /usr/bin/python* 2>/dev/null || true
          python3 --version
          python --version

          # Confirm 3.14 is gone
          python3.14 --version 2>/dev/null && echo "WARNING: 3.14 still present" || echo "OK: python3.14 is gone"

      - name: Install Python Build Tools
        run: |
          python3 -m pip install --upgrade "pip==23.3.2"
          python3 -m pip install "setuptools==68.2.2" "wheel==0.41.3"

          # Cython 3.0.10: the `import cgi` bug in Tempita was fixed in
          # 3.0.3 (https://github.com/cython/cython/issues/5751).
          # We use 3.0.10 (latest stable 3.0.x) which is fully compatible
          # with Kivy 2.2.1 and has no cgi dependency anywhere.
          python3 -m pip install "Cython==3.0.10"

          python3 -m pip install "buildozer==1.5.0"
          python3 -m pip install "python-for-android==2023.05.21"

          echo "=== Installed versions ==="
          python3 -m pip show buildozer python-for-android Cython | grep -E "^(Name|Version)"
          python3 -c "import Cython; print('Cython:', Cython.__version__)"

          # Pre-populate the pip HTTP cache with the Cython wheel so when
          # p4a's internal venv runs `pip install Cython` it gets a cached
          # copy instead of resolving to a different version from PyPI.
          python3 -m pip download "Cython==3.0.10" \
            --dest /tmp/cython-cache \
            --no-deps
          echo "Cached Cython wheel:"
          ls /tmp/cython-cache/

      # ----------------------------------------------------------------
      # Tell pip (all invocations, including p4a's internal venvs) to
      # use /tmp/cython-cache as an extra index so it always finds
      # our pinned Cython 3.0.10 wheel first without going to PyPI.
      # PIP_FIND_LINKS is honoured by every pip subprocess automatically.
      # ----------------------------------------------------------------
      - name: Export pip environment overrides
        run: |
          echo "PIP_FIND_LINKS=/tmp/cython-cache" >> $GITHUB_ENV
          # Also constrain Cython so pip never upgrades beyond 3.0.10
          echo "Cython==3.0.10" > /tmp/pip-constraints.txt
          echo "PIP_CONSTRAINT=/tmp/pip-constraints.txt" >> $GITHUB_ENV

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34-ndk25b
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Clean all stale buildozer artefacts
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/app
          echo "SDK/NDK cache:"
          ls ~/.buildozer/android/platform/ 2>/dev/null || echo "(empty)"

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Print tail of build log on failure
        if: failure()
        run: |
          echo "====== LAST 150 LINES OF BUILD LOG ======"
          tail -n 150 build.log || echo "(build.log not found)"
          echo "=========================================="
          echo ""
          echo "====== ALL ERRORS IN LOG ======"
          grep -i -E "(error|exception|traceback|no module|failed|cannot)" build.log | tail -n 50 || echo "(no matches)"
          echo "================================"

      - name: Verify APK was produced
        run: |
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK found:"
            ls -lh bin/*.apk
          else
            echo "ERROR: No APK found. Diagnosing..."
            ls -la bin/ 2>/dev/null || echo "(bin/ missing)"
            find . -name "*.apk" 2>/dev/null || echo "(no .apk anywhere)"
            exit 1
          fi

      - name: Show APK SDK versions
        run: |
          APK=$(ls bin/*.apk | head -1)
          aapt dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|package"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
