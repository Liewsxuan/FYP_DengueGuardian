name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            ccache \
            lld \
            aapt

      - name: Set JAVA_HOME and PATH
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      # ----------------------------------------------------------------
      # ROOT CAUSE FIX: p4a creates internal temp venvs using the system
      # python3, which on this runner is Python 3.14 (no `cgi` module).
      # We replace all python3/python symlinks with our 3.10 binary so
      # every subprocess p4a spawns gets the correct Python version.
      # ----------------------------------------------------------------
      - name: Force system python3 → Python 3.10
        run: |
          PYTHON310="/opt/hostedtoolcache/Python/3.10.20/x64/bin/python3.10"

          echo "Before fix:"
          python3 --version || true

          sudo ln -sf "$PYTHON310" /usr/bin/python3
          sudo ln -sf "$PYTHON310" /usr/bin/python
          sudo ln -sf "$PYTHON310" /usr/local/bin/python3
          sudo ln -sf "$PYTHON310" /usr/local/bin/python
          sudo update-alternatives --install /usr/bin/python3 python3 "$PYTHON310" 100 2>/dev/null || true
          sudo update-alternatives --set python3 "$PYTHON310" 2>/dev/null || true

          echo "After fix:"
          python3 --version
          python --version

      - name: Install Python Build Tools
        run: |
          python3 -m pip install --upgrade "pip==23.3.2"
          python3 -m pip install "setuptools==68.2.2" "wheel==0.41.3"
          python3 -m pip install "Cython==0.29.36"
          python3 -m pip install "buildozer==1.5.0"
          python3 -m pip install "python-for-android==2023.05.21"

          echo "=== Installed versions ==="
          python3 -m pip show buildozer python-for-android Cython | grep -E "^(Name|Version)"
          echo "=== Python check ==="
          python3 -c "import sys; print('sys.version:', sys.version)"
          python3 -c "import Cython; print('Cython:', Cython.__version__)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34-ndk25b
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Clean all stale buildozer artefacts
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/app
          echo "SDK/NDK cache:"
          ls ~/.buildozer/android/platform/ 2>/dev/null || echo "(empty — will download)"

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Print tail of build log on failure
        if: failure()
        run: |
          echo "====== LAST 150 LINES OF BUILD LOG ======"
          tail -n 150 build.log || echo "(build.log not found)"
          echo "=========================================="
          echo ""
          echo "====== ALL ERRORS IN LOG ======"
          grep -i -E "(error|exception|traceback|no module|failed|cannot)" build.log | tail -n 50 || echo "(no matches)"
          echo "================================"

      - name: Verify APK was produced
        run: |
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK found:"
            ls -lh bin/*.apk
          else
            echo "ERROR: No APK found. Diagnosing..."
            ls -la bin/ 2>/dev/null || echo "(bin/ missing)"
            find . -name "*.apk" 2>/dev/null || echo "(no .apk anywhere)"
            exit 1
          fi

      - name: Show APK SDK versions
        run: |
          APK=$(ls bin/*.apk | head -1)
          aapt dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|package"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
