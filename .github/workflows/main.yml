name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer

      # =========================================================
      # PYTHON 3.10
      # =========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
        python-version: '3.11'

      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install System Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            build-essential \
            git \
            ccache \
            lld \
            aapt

      # =========================================================
      # JAVA
      # =========================================================

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      # =========================================================
      # PYTHON TOOLS
      # =========================================================

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip==23.3.2
      
          python -m pip install \
          setuptools==68.2.2 \
          wheel==0.41.3 \
          Cython==0.29.36 \

          # IMPORTANT:
          # Kivy 2.2.1 is more stable with Cython 0.29.x
          python -m pip install Cython==0.29.37

          python -m pip install buildozer==1.5.0 \

          echo "=== INSTALLED ==="
          python -m pip show buildozer
          python -m pip show Cython

      # =========================================================
      # PATCH CYTHON CGI ISSUE
      # =========================================================

      - name: Patch Cython cgi issue
        run: |
          python - << 'PY'
          import pathlib
          import site

          patched = False

          for sp in site.getsitepackages():
              for f in pathlib.Path(sp).rglob("_tempita.py"):
                  txt = f.read_text()

                  if "import cgi" in txt:
                      txt = txt.replace(
                          "import cgi",
                          "import html as cgi\ncgi.escape = html.escape"
                      )

                      f.write_text(txt)

                      print("PATCHED:", f)
                      patched = True

          print("DONE:", patched)
          PY

      # =========================================================
      # CACHE
      # =========================================================

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean old buildozer files
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/app

      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build APK
        run: |
          buildozer android debug

      # =========================================================
      # SHOW LOGS IF FAILED
      # =========================================================

      - name: Show Buildozer Logs
        if: failure()
        run: |
          echo "========= BUILDOZER LOGS ========="

          find .buildozer -name "*.log" 2>/dev/null

          echo "========= LAST 200 LINES ========="

          find .buildozer -name "*.log" | while read f; do
            echo "----- $f -----"
            tail -n 200 "$f"
          done

      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK Exists
        run: |
          ls -lah bin/

          APK=$(find bin -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-APK
          path: bin/*.apk
