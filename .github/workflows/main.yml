name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            ccache \
            lld \
            aapt

      - name: Set JAVA_HOME and PATH
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34-ndk25b
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache p4a build artefacts
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/build-*
          key: p4a-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-build-${{ runner.os }}-

      - name: Clean stale app build artefacts
        run: |
          rm -rf .buildozer/android/app
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf .buildozer/android/platform/build-armeabi-v7a

      # ----------------------------------------------------------------
      # FIX: The previous workflow piped into tee but never checked if
      # buildozer itself failed. When using a pipe, the shell reports the
      # exit code of the LAST command (tee, which always succeeds), not
      # buildozer. So a failed build looked like a success, no APK was
      # produced, and only the "Verify APK" step revealed the problem —
      # with no useful error message.
      #
      # Fix 1: set pipefail so the pipe fails if buildozer fails.
      # Fix 2: always upload the full build.log so you can read the real
      #         error even after the job is marked failed.
      # Fix 3: explicitly check the bin/ directory and print the tail of
      #         the log right in the Actions console for fast diagnosis.
      # ----------------------------------------------------------------
      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          echo "--- Buildozer exit code: $? ---"

      # Always runs — gives you the log even on success, so you can read it
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # Runs only on failure — prints the last 100 lines of the log
      # directly in the Actions console so you see the real error immediately
      - name: Print tail of build log on failure
        if: failure()
        run: |
          echo "====== LAST 100 LINES OF BUILD LOG ======"
          tail -n 100 build.log || echo "(build.log not found)"
          echo "=========================================="
          echo ""
          echo "====== ERRORS AND EXCEPTIONS ======"
          grep -i -E "(error|exception|traceback|failed|no such)" build.log | tail -n 40 || echo "(no matches)"
          echo "==================================="

      - name: Verify APK was produced
        run: |
          mkdir -p bin
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK found:"
            ls -lh bin/*.apk
          else
            echo "ERROR: No APK in bin/. Listing workspace to help diagnose:"
            echo "--- bin/ contents ---"
            ls -la bin/ || echo "(bin/ is empty or missing)"
            echo "--- .buildozer/android/app/ ---"
            ls -la .buildozer/android/app/ 2>/dev/null || echo "(directory missing)"
            echo "--- Find any .apk anywhere ---"
            find . -name "*.apk" 2>/dev/null || echo "(none found)"
            exit 1
          fi

      - name: Show APK min/target SDK
        run: |
          APK=$(ls bin/*.apk | head -1)
          echo "Checking: $APK"
          aapt dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|package"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
