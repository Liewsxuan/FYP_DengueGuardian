name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            ccache \
            lld \
            aapt

      - name: Set JAVA_HOME and PATH
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade "pip==23.3.2"
          python3 -m pip install "setuptools==68.2.2" "wheel==0.41.3"
          python3 -m pip install "Cython==3.0.10"
          python3 -m pip install "buildozer==1.5.0"
          python3 -m pip install "python-for-android==2023.05.21"

          echo "=== Versions ==="
          python3 -m pip show buildozer python-for-android Cython | grep -E "^(Name|Version)"

      # ----------------------------------------------------------------
      # FIX for "No module named 'cgi'"
      #
      # pip's PEP 517 build isolation creates /tmp/build-env-XXXX/ using
      # the system Python 3.14, installs Cython there, then Cython's
      # _tempita.py crashes with `import cgi` (removed in Python 3.13+).
      #
      # APPROACH:
      # 1. Pre-install Cython 3.0.10 into all Python versions — only
      #    scanning known safe directories (NOT / which takes 20+ minutes)
      # 2. Write /etc/pip.conf with constraints (read even in --isolated)
      # 3. Background watcher during build: patch /tmp/build-env-* only,
      #    which is the ONLY place pip creates isolated build envs
      # ----------------------------------------------------------------

      - name: Layer 1 — Pre-install Cython into all system Pythons
        run: |
          # ONLY search known Python binary locations — never scan from /
          SEARCH_DIRS="/usr/bin /usr/local/bin /opt/hostedtoolcache"
          echo "=== Python binaries found ==="
          find $SEARCH_DIRS -name "python3*" -type f 2>/dev/null \
            | grep -E "python3\.[0-9]+$" | sort -u

          for PYBIN in $(find $SEARCH_DIRS -name "python3*" -type f 2>/dev/null \
                         | grep -E "python3\.[0-9]+$" | sort -u); do
            VER=$("$PYBIN" --version 2>&1 || echo "unknown")
            echo "--- Installing Cython into $PYBIN ($VER) ---"
            sudo "$PYBIN" -m pip install --quiet "Cython==3.0.10" 2>/dev/null \
              && echo "  OK" || echo "  (no pip, skipped)"
          done

      - name: Layer 2 — Write /etc/pip.conf (survives --isolated mode)
        run: |
          python3 -m pip download "Cython==3.0.10" \
            --dest /opt/cython-wheels --no-deps --quiet
          echo "Cython==3.0.10" | sudo tee /opt/cython-constraints.txt > /dev/null

          sudo tee /etc/pip.conf > /dev/null << 'EOF'
          [global]
          constraint = /opt/cython-constraints.txt
          find-links = /opt/cython-wheels
          EOF
          echo "=== /etc/pip.conf ==="
          cat /etc/pip.conf

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34-ndk25b
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Clean all stale buildozer artefacts
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/app
          echo "SDK/NDK cache:"
          ls ~/.buildozer/android/platform/ 2>/dev/null || echo "(empty)"

      - name: Layer 3 — Build APK with /tmp watcher
        run: |
          set -o pipefail

          # Patch _tempita.py files ONLY inside /tmp (where pip puts
          # isolated build envs). Never scan the whole filesystem.
          patch_tmp() {
            find /tmp -name "_tempita.py" 2>/dev/null | while read -r f; do
              if grep -q "^import cgi" "$f" 2>/dev/null; then
                sed -i \
                  's/^import cgi$/import html as cgi; cgi.escape = html.escape/' \
                  "$f" && echo "[WATCHER] Patched: $f"
              fi
            done
          }

          # Patch anything already in /tmp right now
          patch_tmp

          # Background watcher — checks /tmp every 0.3s during build
          (
            while true; do
              patch_tmp
              sleep 0.3
            done
          ) &
          WATCHER_PID=$!
          echo "Watcher started (PID $WATCHER_PID), monitoring /tmp only"

          buildozer -v android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          kill $WATCHER_PID 2>/dev/null || true
          wait $WATCHER_PID 2>/dev/null || true

          exit $BUILD_EXIT

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Print tail of build log on failure
        if: failure()
        run: |
          echo "====== LAST 150 LINES ======"
          tail -n 150 build.log || echo "(not found)"
          echo "====== ALL ERRORS ======"
          grep -i -E "(error|exception|traceback|no module|failed|cannot)" \
            build.log | tail -n 50 || echo "(no matches)"

      - name: Verify APK was produced
        run: |
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK found:"
            ls -lh bin/*.apk
          else
            echo "ERROR: No APK found."
            ls -la bin/ 2>/dev/null || echo "(bin/ missing)"
            find . -name "*.apk" 2>/dev/null || echo "(none)"
            exit 1
          fi

      - name: Show APK SDK versions
        run: |
          APK=$(ls bin/*.apk | head -1)
          aapt dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|package"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
