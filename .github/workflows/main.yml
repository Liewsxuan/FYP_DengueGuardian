name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          # Python 3.10 is required — Cython 0.29.36 + buildozer 1.5.0
          # have known issues with 3.11+
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            ccache \
            lld \
            aapt

      # ----------------------------------------------------------------
      # FIX: Set JAVA_HOME and prepend to PATH using $GITHUB_ENV and
      # $GITHUB_PATH files — the ONLY correct way in GitHub Actions.
      # Using ${{ env.PATH }} inside an env: block is invalid syntax;
      # it resolves to an empty string, which breaks PATH entirely and
      # causes ANY command to fail with exit code 127 ("not found").
      # ----------------------------------------------------------------
      - name: Set JAVA_HOME and PATH
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          # Do NOT pin python-for-android separately.
          # buildozer 1.5.0 resolves and installs the correct compatible version.

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34-ndk25b
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache p4a build artefacts
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/build-*
          key: p4a-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-build-${{ runner.os }}-

      - name: Clean stale app build artefacts
        run: |
          rm -rf .buildozer/android/app
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf .buildozer/android/platform/build-armeabi-v7a

      # ----------------------------------------------------------------
      # FIX: No env: block here at all. JAVA_HOME and ccache PATH were
      # already exported via $GITHUB_ENV / $GITHUB_PATH above and are
      # automatically available to every subsequent step — no need to
      # re-declare them, and re-declaring with ${{ env.PATH }} breaks
      # everything.
      # ----------------------------------------------------------------
      - name: Build debug APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK was produced
        run: |
          ls -lh bin/*.apk
          echo "APK build succeeded"

      - name: Show APK min/target SDK (sanity check)
        run: |
          APK=$(ls bin/*.apk | head -1)
          aapt dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          retention-days: 7
