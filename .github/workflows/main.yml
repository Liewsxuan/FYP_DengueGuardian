name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            liblzma-dev \
            tk-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            ccache \
            lld \
            aapt

      - name: Set JAVA_HOME and PATH
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      # ----------------------------------------------------------------
      # FIX 1: "No module named 'cgi'" — the cgi module was removed in
      # Python 3.13. The GitHub runner has multiple Python versions
      # installed system-wide. p4a's subprocess was inheriting the system
      # python3 (which may be 3.13) instead of the 3.10 we set up.
      #
      # Solution: explicitly tell p4a which Python binary to use by
      # setting PYTHON and PYTHONPATH, and verify what python3 resolves to
      # before running buildozer.
      # ----------------------------------------------------------------
      - name: Verify Python version and fix interpreter
        run: |
          echo "=== which python / python3 ==="
          which python
          which python3
          python --version
          python3 --version
          echo "=== pip version ==="
          pip --version

          # Force the PATH-resolved python3 to be our 3.10 by symlinking
          PYTHON310=$(which python)
          sudo ln -sf "$PYTHON310" /usr/local/bin/python3
          sudo ln -sf "$PYTHON310" /usr/local/bin/python

          echo "=== After symlink ==="
          python3 --version
          python --version

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip setuptools wheel
          # Cython 0.29.36 is the last version compatible with Kivy 2.2.1's
          # .pyx files. Newer Cython changes the API and breaks config.pxi resolution.
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          # Verify Cython is correct version
          python -c "import Cython; print('Cython version:', Cython.__version__)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ runner.os }}

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-api34-ndk25b
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ----------------------------------------------------------------
      # FIX 2: "config.pxi not resolved" — this is a stale p4a build
      # cache problem. When a cached build-* directory exists from a
      # previous failed or mismatched run, p4a's Cython dependency
      # scanner finds half-compiled .pxi files in the wrong state and
      # fails to resolve them.
      #
      # Solution: do NOT cache the p4a build-* directories at all.
      # They are architecture-specific compiled C/Cython outputs that
      # must be built fresh against the exact SDK+NDK+Cython combination.
      # Only cache the SDK/NDK (which never changes) and pip (small).
      # ----------------------------------------------------------------

      # ----------------------------------------------------------------
      # FIX 3: Wipe ALL of .buildozer except the SDK/NDK cache.
      # The previous workflow only deleted build-arm64 and build-armeabi
      # but left behind .buildozer/android/platform/python-for-android/
      # which also contains stale .pxi / .pxd files from prior runs.
      # ----------------------------------------------------------------
      - name: Clean ALL stale buildozer artefacts (keep SDK/NDK only)
        run: |
          # Keep SDK and NDK, wipe everything else buildozer generated
          rm -rf .buildozer

          # Also clean the global p4a cache which persists between runs
          # and is the primary source of stale config.pxi errors
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/app

          echo "Cleaned. Remaining in ~/.buildozer/android/platform/:"
          ls ~/.buildozer/android/platform/ 2>/dev/null || echo "(empty — SDK/NDK will be downloaded)"

      - name: Build debug APK
        env:
          # Force p4a to use our Python 3.10, not any system python3
          PYTHON: python
          # Ensure the correct SDK root is visible to buildozer/p4a
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Print tail of build log on failure
        if: failure()
        run: |
          echo "====== LAST 150 LINES OF BUILD LOG ======"
          tail -n 150 build.log || echo "(build.log not found)"
          echo "=========================================="
          echo ""
          echo "====== ALL ERRORS IN LOG ======"
          grep -i -E "(error|exception|traceback|no module|failed|cannot)" build.log | tail -n 50 || echo "(no matches)"
          echo "================================"

      - name: Verify APK was produced
        run: |
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK found:"
            ls -lh bin/*.apk
          else
            echo "ERROR: No APK found. Diagnosing..."
            echo "--- bin/ ---"
            ls -la bin/ 2>/dev/null || echo "(missing)"
            echo "--- find .apk ---"
            find . -name "*.apk" 2>/dev/null || echo "(none)"
            exit 1
          fi

      - name: Show APK SDK versions
        run: |
          APK=$(ls bin/*.apk | head -1)
          aapt dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|package"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DengueGuardian-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
